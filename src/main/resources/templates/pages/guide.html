<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: commonHead(title='주차 유도 | EzPark', console=false)}"></head>
<body data-root="../" data-page="guide" th:data-user-id="${loginUser?.id}" th:data-user-name="${loginUser?.name}" th:data-user-email="${loginUser?.email}" th:data-user-role="${loginUser?.role}" data-server="true">
  <header th:replace="~{fragments/layout :: publicHeader(transparent=false)}"></header>

  <section class="page-hero" data-bg="garageArrow">
    <div class="container">
      <div class="breadcrumb-ez"><a href="../index.html">홈</a><span>/</span><span>주차 서비스</span><span>/</span><span class="text-white">주차 유도</span></div>
      <h1>스마트 주차 유도</h1>
      <p class="mb-0">층별 주차면 지도에서 빈자리를 선택하거나 AI 추천을 받아 입구에서 주차면까지 최단 경로로 안내받으세요.</p>
    </div>
  </section>

  <section class="page-body">
    <div class="container">
      <!-- Controls -->
      <div class="ez-card p-3 p-lg-4 mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-lg-4">
            <label class="form-label small mb-1" for="lotSel">주차장</label>
            <select class="form-select" id="lotSel"></select>
          </div>
          <div class="col-lg-4">
            <div class="form-label small mb-1">층 선택</div>
            <div class="btn-group floor-tabs flex-wrap" role="group" id="floorTabs" aria-label="층 선택"></div>
          </div>
          <div class="col-lg-4">
            <div class="form-label small mb-1">추천 조건</div>
            <div class="d-flex flex-wrap gap-3 align-items-center">
              <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="optEv"><label class="form-check-label small" for="optEv">전기차 충전</label></div>
              <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="optDis"><label class="form-check-label small" for="optDis">장애인 주차</label></div>
              <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="optElev"><label class="form-check-label small" for="optElev">엘리베이터 근접</label></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="ez-card p-3 d-flex align-items-center gap-3"><div class="icon-box sm blue"><i class="fa-solid fa-square-parking"></i></div><div><div class="small text-muted-2">층 전체면</div><div class="fw-800 font-en fs-5 text-navy" id="sTotal">0</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="ez-card p-3 d-flex align-items-center gap-3"><div class="icon-box sm mint"><i class="fa-solid fa-circle-check"></i></div><div><div class="small text-muted-2">빈자리</div><div class="fw-800 font-en fs-5 text-mint" id="sFree">0</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="ez-card p-3 d-flex align-items-center gap-3"><div class="icon-box sm purple"><i class="fa-solid fa-charging-station"></i></div><div><div class="small text-muted-2">EV 충전 빈자리</div><div class="fw-800 font-en fs-5 text-navy" id="sEv">0</div></div></div></div>
        <div class="col-6 col-lg-3"><div class="ez-card p-3 d-flex align-items-center gap-3"><div class="icon-box sm yellow"><i class="fa-solid fa-gauge"></i></div><div><div class="small text-muted-2">층 점유율</div><div class="fw-800 font-en fs-5 text-navy" id="sRate">0%</div></div></div></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="ez-card p-3 p-lg-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h5 class="fw-800 text-navy m-0"><span id="mapTitle">B1</span> 주차면 지도</h5>
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-primary" id="btnRecommend"><i class="fa-solid fa-wand-magic-sparkles me-1"></i>AI 추천 자리</button>
                <button class="btn btn-sm btn-outline-secondary" id="btnReset"><i class="fa-solid fa-rotate-left me-1"></i>초기화</button>
              </div>
            </div>
            <div class="lot-map-wrap">
              <svg class="lot-map" id="lotMap" viewBox="0 0 1000 540" role="img" aria-label="층별 주차면 지도"></svg>
            </div>
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
              <div class="slot-legend">
                <span class="l-free">빈자리</span><span class="l-busy">주차중</span><span class="l-ev">EV 충전</span><span class="l-dis">장애인</span><span class="l-rsv">예약</span>
              </div>
              <span class="small text-muted-2"><span class="live-dot text-danger me-1">LIVE</span> <span id="mapUpdated"></span></span>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="ez-card p-4 mb-4">
            <h5 class="fw-800 text-navy mb-3"><i class="fa-solid fa-diamond-turn-right text-blue me-2"></i>경로 안내</h5>
            <div id="routePanel">
              <div class="empty-state py-4"><i class="fa-solid fa-hand-pointer d-block"></i>지도에서 <b class="text-mint">빈자리</b>를 선택하거나<br><b class="text-blue">AI 추천 자리</b>를 눌러 주세요.</div>
            </div>
          </div>
          <div class="ez-card p-4">
            <h6 class="fw-800 text-navy mb-3">층별 빈자리 현황</h6>
            <div id="floorList"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer th:replace="~{fragments/layout :: publicFooter}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/guide.js"></script>
</body>
</html>
