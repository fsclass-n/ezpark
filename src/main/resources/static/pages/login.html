<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | EzPark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-root="../" data-page="login">
  <div class="auth-wrap">
    <div class="auth-visual" data-bg="garageNeon">
      <div>
        <span class="ez-badge yellow mb-3"><i class="fa-solid fa-bolt"></i> AI Smart Parking</span>
        <h2 class="fw-800 mb-3" style="font-size:2.4rem;line-height:1.3">빈자리를 찾는 시간,<br>이제 AI에게 맡기세요</h2>
        <p class="opacity-75 mb-4">실시간 영상 인지로 3초마다 갱신되는 주차 정보와<br>입구부터 주차면까지의 경로 안내를 경험하세요.</p>
        <div class="d-flex gap-4">
          <div><div class="fw-800 font-en fs-3">12,480+</div><div class="small opacity-75">관제 주차면</div></div>
          <div><div class="fw-800 font-en fs-3">97.8%</div><div class="small opacity-75">인지 정확도</div></div>
        </div>
      </div>
    </div>

    <div class="auth-form">
      <a class="brand mb-5" href="../index.html"><span class="brand-logo">E</span><span class="brand-text">Ez<b>Park</b></span></a>
      <h3 class="fw-800 text-navy mb-1">다시 오신 것을 환영합니다</h3>
      <p class="text-muted-2 mb-4">계정이 없으신가요? <a href="register.html" class="fw-bold">회원가입</a></p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">이메일</label>
          <div class="input-icon"><i class="fa-regular fa-envelope"></i><input type="email" class="form-control" id="email" placeholder="you@example.com" required autocomplete="email"><div class="invalid-feedback">올바른 이메일 주소를 입력해 주세요.</div></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">비밀번호</label>
          <div class="input-icon position-relative"><i class="fa-solid fa-lock"></i><input type="password" class="form-control pe-5" id="password" placeholder="8자 이상" required minlength="8" autocomplete="current-password"><button type="button" class="pw-toggle" data-target="password" aria-label="비밀번호 보기"><i class="fa-regular fa-eye"></i></button><div class="invalid-feedback">비밀번호를 8자 이상 입력해 주세요.</div></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4 small">
          <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">이메일 기억하기</label></div>
          <a href="#" id="findPw">비밀번호 찾기</a>
        </div>
        <div class="alert alert-danger small py-2 rounded-3" id="loginErr" hidden></div>
        <button class="btn btn-primary btn-lg w-100" id="loginBtn">로그인</button>
      </form>

      <div class="divider-text">또는 간편 로그인</div>
      <div class="d-grid gap-2">
        <button class="social-btn" data-social="Google"><i class="fa-brands fa-google" style="color:#4285f4"></i>Google로 계속하기</button>
        <div class="row g-2">
          <div class="col-6"><button class="social-btn kakao" data-social="카카오"><i class="fa-solid fa-comment"></i>카카오</button></div>
          <div class="col-6"><button class="social-btn naver" data-social="네이버"><b>N</b>네이버</button></div>
        </div>
      </div>

      <div class="bg-soft rounded-4 p-3 small text-muted-2 mt-4">
        <i class="fa-solid fa-circle-info text-blue me-1"></i><b>데모 계정</b> · 관리자 <code>admin@ezpark.kr</code> / <code>ezpark1234</code>
        <button type="button" class="btn btn-sm btn-soft ms-1 py-0" id="fillDemo">자동 입력</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/pages/auth.js"></script>
</body>
</html>
